<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
    <filter id="card-shadow" x="0" y="0" width="390" height="844" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="390" height="844" rx="40" fill="#F8FAFC" />
  <rect width="390" height="844" rx="40" stroke="#E2E8F0" stroke-width="2" />

  <!-- iOS Status Bar -->
  <text x="32" y="32" font-size="14" font-weight="600" fill="#0F172A">9:41</text>
  <!-- Dynamic Island -->
  <rect x="135" y="14" width="120" height="28" rx="14" fill="#0F172A" />
  <!-- Signal, Wifi, Battery -->
  <g transform="translate(325, 20)" fill="#0F172A">
    <rect x="0" y="7" width="3" height="5" rx="0.5" />
    <rect x="4" y="5" width="3" height="7" rx="0.5" />
    <rect x="8" y="3" width="3" height="9" rx="0.5" />
    <rect x="12" y="1" width="3" height="11" rx="0.5" />
    <path d="M22 2C20.5 2 19 2.5 18 3.5L22 8L26 3.5C25 2.5 23.5 2 22 2Z" />
    <rect x="30" y="1" width="20" height="11" rx="3" stroke="#0F172A" stroke-width="1.5" fill="none" />
    <rect x="32" y="3" width="13" height="7" rx="1.5" fill="#0F172A" />
  </g>

  <!-- Top App Navigation Bar -->
  <rect x="0" y="50" width="390" height="48" fill="#FFFFFF" />
  <path d="M24 74L17 67L24 60" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="195" y="70" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="0.5">TRACK PACKAGE</text>
  <text x="195" y="84" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">REAL-TIME GPS SYNC</text>
  <circle cx="366" cy="67" r="14" fill="#F1F5F9" />
  <text x="366" y="72" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">?</text>
  <line x1="0" y1="98" x2="390" y2="98" stroke="#E2E8F0" />

  <!-- 1. Hero Delivery Status Card -->
  <g transform="translate(16, 110)">
    <rect width="358" height="180" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
    <rect width="358" height="4" rx="2" fill="#F59E0B" />
    
    <!-- Order ID -->
    <text x="16" y="28" font-size="11" font-weight="500" fill="#64748B">Order ID: <tspan font-weight="700" font-family="monospace" fill="#1E293B">ORD-77194-US</tspan></text>
    
    <!-- Status Badge -->
    <rect x="230" y="14" width="112" height="22" rx="11" fill="#FEF3C7" stroke="#FDE68A" />
    <circle cx="242" cy="25" r="3" fill="#D97706" />
    <text x="252" y="29" font-size="10" font-weight="700" fill="#92400E">DELAYED IN TRANSIT</text>

    <!-- Headline ETA -->
    <text x="16" y="62" font-size="10" font-weight="700" fill="#64748B" letter-spacing="0.5">REVISED ESTIMATED ARRIVAL</text>
    <text x="16" y="92" font-size="22" font-weight="700" fill="#0F172A">Tomorrow, Oct 27</text>
    <text x="16" y="112" font-size="11" font-weight="400" fill="#475569">Midwest flight grounded due to severe weather. Rerouted via Denver.</text>

    <!-- Progress Gauge -->
    <text x="16" y="142" font-size="10" font-weight="600" fill="#64748B">Delivery Progress</text>
    <text x="342" y="142" font-size="10" font-weight="700" fill="#0F172A" text-anchor="end">50% Complete</text>
    <rect x="16" y="150" width="326" height="8" rx="4" fill="#F1F5F9" />
    <rect x="16" y="150" width="163" height="8" rx="4" fill="#F59E0B" />
  </g>

  <!-- 2. Situational Banner: Delayed Order -->
  <g transform="translate(16, 302)">
    <rect width="358" height="162" rx="16" fill="#FFFBEB" stroke="#FDE68A" />
    
    <rect x="14" y="14" width="32" height="32" rx="10" fill="#FDE68A" />
    <text x="30" y="35" font-size="16" font-weight="700" fill="#92400E" text-anchor="middle">⚠️</text>
    
    <text x="56" y="27" font-size="13" font-weight="700" fill="#78350F">Shipment Delay Explanation</text>
    <text x="56" y="44" font-size="11" font-weight="400" fill="#92400E">FAA weather hold halted air freight cargo at regional hub.</text>

    <!-- Compensation Card -->
    <g transform="translate(14, 58)">
      <rect width="330" height="48" rx="10" fill="#FFFFFF" stroke="#FEF3C7" />
      <text x="12" y="20" font-size="11" font-weight="700" fill="#B45309">✨ Automatic $15 Store Courtesy Credit</text>
      <text x="12" y="36" font-size="10" font-weight="400" fill="#64748B">Credited to your account + Priority courier tag attached.</text>
    </g>

    <!-- Action Buttons -->
    <rect x="14" y="118" width="168" height="32" rx="8" fill="#D97706" />
    <text x="98" y="138" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Confirm Priority Delivery</text>

    <rect x="190" y="118" width="154" height="32" rx="8" fill="#FEF3C7" stroke="#FDE68A" />
    <text x="267" y="138" font-size="11" font-weight="600" fill="#78350F" text-anchor="middle">Change Address</text>
  </g>

  <!-- 3. Delivery Milestones Timeline -->
  <g transform="translate(16, 476)">
    <rect width="358" height="210" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
    
    <text x="16" y="28" font-size="13" font-weight="700" fill="#0F172A">Delivery Milestones</text>
    <text x="16" y="42" font-size="10" font-weight="500" fill="#64748B">Live logistics scan updates</text>

    <!-- Connecting line -->
    <line x1="28" y1="68" x2="28" y2="185" stroke="#CBD5E1" stroke-width="2" />

    <!-- Step 1: Completed -->
    <circle cx="28" cy="68" r="9" fill="#D1FAE5" stroke="#10B981" stroke-width="2" />
    <text x="28" y="72" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">✓</text>
    <text x="46" y="66" font-size="11" font-weight="600" fill="#1E293B">Order Confirmed</text>
    <text x="342" y="66" font-size="10" font-family="monospace" fill="#64748B" text-anchor="end">Oct 22, 11:20 AM</text>
    <text x="46" y="79" font-size="10" font-weight="400" fill="#64748B">Payment verified &amp; dispatched</text>

    <!-- Step 2: Completed -->
    <circle cx="28" cy="108" r="9" fill="#D1FAE5" stroke="#10B981" stroke-width="2" />
    <text x="28" y="112" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">✓</text>
    <text x="46" y="106" font-size="11" font-weight="600" fill="#1E293B">Sorted at Regional Center</text>
    <text x="342" y="106" font-size="10" font-family="monospace" fill="#64748B" text-anchor="end">Oct 23, 08:15 PM</text>
    <text x="46" y="119" font-size="10" font-weight="400" fill="#64748B">Transferred to cargo flight</text>

    <!-- Step 3: Current / Delayed -->
    <circle cx="28" cy="148" r="11" fill="#F59E0B" />
    <text x="28" y="152" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">!</text>
    <text x="46" y="146" font-size="11" font-weight="700" fill="#B45309">Weather Hold &amp; Reroute</text>
    <text x="342" y="146" font-size="10" font-family="monospace" fill="#D97706" text-anchor="end">Oct 25, 03:40 AM</text>
    <text x="46" y="159" font-size="10" font-weight="500" fill="#78350F">Midwest hub • Rescheduled via Denver</text>

    <!-- Step 4: Upcoming -->
    <circle cx="28" cy="188" r="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" />
    <text x="46" y="188" font-size="11" font-weight="500" fill="#64748B">Out for Delivery (Rescheduled)</text>
    <text x="342" y="188" font-size="10" font-family="monospace" fill="#64748B" text-anchor="end">ETA: Oct 27</text>
  </g>

  <!-- 4. Carrier & Summary Snippet -->
  <g transform="translate(16, 698)">
    <rect width="358" height="66" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
    <rect x="12" y="14" width="38" height="38" rx="10" fill="#F1F5F9" />
    <text x="31" y="38" font-size="18" text-anchor="middle">🚚</text>
    <text x="60" y="30" font-size="12" font-weight="700" fill="#0F172A">DHL Express Global</text>
    <text x="60" y="44" font-size="10" font-family="monospace" fill="#64748B">DHL-3910-8271-99</text>
    <rect x="278" y="18" width="68" height="28" rx="8" fill="#EEF2FF" />
    <text x="312" y="36" font-size="11" font-weight="600" fill="#4F46E5" text-anchor="middle">Support</text>
  </g>

  <!-- Bottom Floating CTA -->
  <rect x="0" y="776" width="390" height="68" fill="#FFFFFF" stroke="#E2E8F0" />
  <rect x="16" y="788" width="358" height="44" rx="12" fill="#0F172A" />
  <text x="195" y="815" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Request Expedited Transit Assistance</text>
</svg>
