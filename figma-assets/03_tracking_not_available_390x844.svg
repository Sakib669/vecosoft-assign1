<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="390" height="844" rx="40" fill="#F8FAFC" />
  <rect width="390" height="844" rx="40" stroke="#E2E8F0" stroke-width="2" />

  <!-- iOS Status Bar -->
  <text x="32" y="32" font-size="14" font-weight="600" fill="#0F172A">9:41</text>
  <!-- Dynamic Island -->
  <rect x="135" y="14" width="120" height="28" rx="14" fill="#0F172A" />
  <!-- Signal, Wifi, Battery -->
  <g transform="translate(325, 20)" fill="#0F172A">
    <rect x="0" y="7" width="3" height="5" rx="0.5" />
    <rect x="4" y="5" width="3" height="7" rx="0.5" />
    <rect x="8" y="3" width="3" height="9" rx="0.5" />
    <rect x="12" y="1" width="3" height="11" rx="0.5" />
    <path d="M22 2C20.5 2 19 2.5 18 3.5L22 8L26 3.5C25 2.5 23.5 2 22 2Z" />
    <rect x="30" y="1" width="20" height="11" rx="3" stroke="#0F172A" stroke-width="1.5" fill="none" />
    <rect x="32" y="3" width="13" height="7" rx="1.5" fill="#0F172A" />
  </g>

  <!-- Top App Navigation Bar -->
  <rect x="0" y="50" width="390" height="48" fill="#FFFFFF" />
  <path d="M24 74L17 67L24 60" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="195" y="70" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="0.5">TRACK PACKAGE</text>
  <text x="195" y="84" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">FULFILLMENT PIPELINE</text>
  <circle cx="366" cy="67" r="14" fill="#EFF6FF" />
  <text x="366" y="72" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">?</text>
  <line x1="0" y1="98" x2="390" y2="98" stroke="#E2E8F0" />

  <!-- 1. Hero Delivery Status Card -->
  <g transform="translate(16, 110)">
    <rect width="358" height="180" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
    <rect width="358" height="4" rx="2" fill="#3B82F6" />
    
    <!-- Order ID -->
    <text x="16" y="28" font-size="11" font-weight="500" fill="#64748B">Order ID: <tspan font-weight="700" font-family="monospace" fill="#1E293B">ORD-98834-US</tspan></text>
    
    <!-- Status Badge -->
    <rect x="200" y="14" width="142" height="22" rx="11" fill="#DBEAFE" stroke="#BFDBFE" />
    <circle cx="212" cy="25" r="3" fill="#2563EB" />
    <text x="222" y="29" font-size="10" font-weight="700" fill="#1E40AF">PREPARING FULFILLMENT</text>

    <!-- Headline ETA -->
    <text x="16" y="62" font-size="10" font-weight="700" fill="#64748B" letter-spacing="0.5">ESTIMATED DELIVERY WINDOW</text>
    <text x="16" y="92" font-size="22" font-weight="700" fill="#0F172A">Oct 29 – Nov 01</text>
    <text x="16" y="112" font-size="11" font-weight="400" fill="#475569">Fulfillment team is picking items. Tracking assigns upon barcode scan.</text>

    <!-- Progress Gauge -->
    <text x="16" y="142" font-size="10" font-weight="600" fill="#64748B">Order Lifecycle</text>
    <text x="342" y="142" font-size="10" font-weight="700" fill="#2563EB" text-anchor="end">20% Complete</text>
    <rect x="16" y="150" width="326" height="8" rx="4" fill="#F1F5F9" />
    <rect x="16" y="150" width="65" height="8" rx="4" fill="#3B82F6" />
  </g>

  <!-- 2. Situational Banner: Tracking Not Available Yet -->
  <g transform="translate(16, 302)">
    <rect width="358" height="162" rx="16" fill="#EFF6FF" stroke="#BFDBFE" />
    
    <rect x="14" y="14" width="32" height="32" rx="10" fill="#BFDBFE" />
    <text x="30" y="35" font-size="16" font-weight="700" fill="#1E40AF" text-anchor="middle">⏳</text>
    
    <text x="56" y="27" font-size="13" font-weight="700" fill="#1E3A8A">Tracking Number Assigning Soon</text>
    <text x="56" y="44" font-size="11" font-weight="400" fill="#1E40AF">Your order is safe! Warehouse is picking &amp; boxing your items.</text>

    <!-- Warehouse Pipeline Progress -->
    <g transform="translate(14, 58)">
      <rect width="330" height="48" rx="10" fill="#FFFFFF" stroke="#DBEAFE" />
      <text x="12" y="18" font-size="11" font-weight="700" fill="#1E293B">Fulfillment Pipeline (Step 2 of 4)</text>
      <text x="318" y="18" font-size="10" font-weight="600" fill="#2563EB" text-anchor="end">Shelf #B-14</text>
      <rect x="12" y="28" width="306" height="6" rx="3" fill="#F1F5F9" />
      <rect x="12" y="28" width="130" height="6" rx="3" fill="#2563EB" />
      <text x="12" y="44" font-size="9" font-weight="500" fill="#64748B">Expected Dispatch: Today by 6:00 PM</text>
    </g>

    <!-- Action Buttons -->
    <rect x="14" y="118" width="168" height="32" rx="8" fill="#2563EB" />
    <text x="98" y="138" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">🔔 Alert Me on First Scan</text>

    <rect x="190" y="118" width="154" height="32" rx="8" fill="#FFFFFF" stroke="#BFDBFE" />
    <text x="267" y="138" font-size="11" font-weight="600" fill="#1E40AF" text-anchor="middle">Ask Support</text>
  </g>

  <!-- 3. Delivery Milestones Timeline -->
  <g transform="translate(16, 476)">
    <rect width="358" height="210" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
    
    <text x="16" y="28" font-size="13" font-weight="700" fill="#0F172A">Delivery Milestones</text>
    <text x="16" y="42" font-size="10" font-weight="500" fill="#64748B">Warehouse fulfillment progression</text>

    <line x1="28" y1="68" x2="28" y2="185" stroke="#CBD5E1" stroke-width="2" />

    <!-- Step 1: Completed -->
    <circle cx="28" cy="68" r="9" fill="#D1FAE5" stroke="#10B981" stroke-width="2" />
    <text x="28" y="72" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">✓</text>
    <text x="46" y="66" font-size="11" font-weight="600" fill="#1E293B">Order Confirmed &amp; Paid</text>
    <text x="342" y="66" font-size="10" font-family="monospace" fill="#64748B" text-anchor="end">18 mins ago</text>
    <text x="46" y="79" font-size="10" font-weight="400" fill="#64748B">Payment authorized and verified</text>

    <!-- Step 2: Current Active -->
    <circle cx="28" cy="112" r="11" fill="#2563EB" />
    <circle cx="28" cy="112" r="5" fill="#FFFFFF" />
    <text x="46" y="108" font-size="11" font-weight="700" fill="#1D4ED8">Fulfillment &amp; Quality Check</text>
    <text x="342" y="108" font-size="10" font-family="monospace" fill="#2563EB" text-anchor="end">In Progress</text>
    <text x="46" y="122" font-size="10" font-weight="500" fill="#1E40AF">Items being picked and packed at Reno Hub #3</text>

    <!-- Step 3: Upcoming -->
    <circle cx="28" cy="154" r="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" />
    <text x="46" y="152" font-size="11" font-weight="500" fill="#64748B">Carrier Hand-off &amp; Live Tracking</text>
    <text x="342" y="152" font-size="10" font-family="monospace" fill="#64748B" text-anchor="end">Est. 6:00 PM</text>
    <text x="46" y="165" font-size="10" font-weight="400" fill="#94A3B8">Tracking ID assigned on carrier pickup</text>

    <!-- Step 4: Upcoming -->
    <circle cx="28" cy="192" r="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" />
    <text x="46" y="192" font-size="11" font-weight="500" fill="#94A3B8">Estimated Delivery Drop-off</text>
    <text x="342" y="192" font-size="10" font-family="monospace" fill="#94A3B8" text-anchor="end">Oct 29 – Nov 01</text>
  </g>

  <!-- 4. Carrier Card Pending -->
  <g transform="translate(16, 698)">
    <rect width="358" height="66" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
    <rect x="12" y="14" width="38" height="38" rx="10" fill="#F1F5F9" />
    <text x="31" y="38" font-size="18" text-anchor="middle">⏳</text>
    <text x="60" y="30" font-size="12" font-weight="700" fill="#0F172A">Carrier Assignment in Progress</text>
    <text x="60" y="44" font-size="10" font-family="monospace" fill="#64748B">Pending Courier Dispatch</text>
    <rect x="268" y="18" width="78" height="28" rx="8" fill="#F1F5F9" />
    <text x="307" y="36" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">Standard</text>
  </g>

  <!-- Bottom Floating CTA -->
  <rect x="0" y="776" width="390" height="68" fill="#FFFFFF" stroke="#E2E8F0" />
  <rect x="16" y="788" width="358" height="44" rx="12" fill="#0F172A" />
  <text x="195" y="815" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Need Help with this Order?</text>
</svg>
